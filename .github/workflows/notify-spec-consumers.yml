name: notify spec consumers

# When conformance-relevant spec files change on main, notify repos that pin the
# spec by SHA (acdp-rs, acdp-verifier-py, acdp-registry-rs) so each opens a held
# "adopt new spec" PR via acdp-ci's bump-spec-ref. App-authenticated (org
# secrets) — no PAT.

on:
  push:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'rfcs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [acdp-rs, acdp-verifier-py, acdp-registry-rs]
    steps:
      - name: Mint token for ${{ matrix.repo }}
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACDP_BOT_APP_ID }}
          private-key: ${{ secrets.ACDP_BOT_PRIVATE_KEY }}
          owner: agentcontextdistributionprotocol
          repositories: ${{ matrix.repo }}
      - name: Dispatch spec-released
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ matrix.repo }}
        run: |
          jq -nc --arg s "$SHA" '{event_type:"spec-released",client_payload:{sha:$s}}' \
            | gh api "repos/agentcontextdistributionprotocol/$REPO/dispatches" --method POST --input -
